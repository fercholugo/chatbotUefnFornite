name: Scrape Fortnite UEFN Tutorials

on:
  # Run weekly on Mondays at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1'
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Optionally run on push to main (for testing)
  # push:
  #   branches: [ main ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run scraper
      run: |
        python main.py scrape --update
    
    - name: Check for changes
      id: check_changes
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "changes=true" >> $GITHUB_OUTPUT
        else
          echo "changes=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit and push changes
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/
        git commit -m "🤖 Auto-update: Scraped tutorials on $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        git push
    
    - name: Create summary
      if: always()
      run: |
        echo "## Scraping Results 🎮" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f data/tutorials.json ]; then
          TUTORIAL_COUNT=$(python -c "import json; data=json.load(open('data/tutorials.json')); print(data['metadata']['total_count'])")
          SCRAPED_AT=$(python -c "import json; data=json.load(open('data/tutorials.json')); print(data['metadata']['scraped_at'])")
          
          echo "- **Total Tutorials:** $TUTORIAL_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Scraped At:** $SCRAPED_AT" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: scraper-logs
        path: scraper.log
        retention-days: 30
